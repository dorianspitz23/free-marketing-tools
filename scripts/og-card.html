<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    display: flex; flex-direction: column; justify-content: center; padding: 0 90px; box-sizing: border-box;
    background: radial-gradient(circle at 85% 20%, #3b2f9e 0%, transparent 45%), #0d0d12;
    color: #ececf3; font-family: system-ui, "Segoe UI", Roboto, sans-serif;
  }
  .kicker { font-size: 34px; font-weight: 700; color: #8f82ff; margin: 0 0 18px; }
  h1 { font-size: 92px; line-height: 1.02; margin: 0; letter-spacing: -0.02em; }
  p { font-size: 34px; color: #a3a3b5; margin: 28px 0 0; }
</style>
</head>
<body>
  <div class="kicker">10 days · 10 tools</div>
  <h1>Free marketing tools,<br>one a day</h1>
  <p>No sign-up. Works on your phone.</p>
</body>
</html>
